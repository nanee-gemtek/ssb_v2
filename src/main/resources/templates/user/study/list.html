<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <link rel="stylesheet" th:href="@{/css/user/sub.css}">
        <link rel="stylesheet" th:href="@{/css/user/pagination.css}">
        <link rel="stylesheet" th:href="@{/css/user/study_list.css}">
    </th:block>
</head>


<div layout:fragment="content" class="container study_list">

    <div class="wrap_list">

        <!-- 카드 그리드 -->
        <div class="card-grid">
            <div class="card"
                 th:each="p : ${paging.content}">
                <div class="card-body">

                    <!-- 썸네일 + 제품명 -->
                    <div class="card-header">
                        <!-- 이미지 있는 경우 -->
<!--                        <img class="study-thumb"-->
<!--                             th:src="${#lists.isEmpty(p.imagePaths) ? @{/img/no-image.png} : p.imagePaths[0]}"-->
<!--                             alt="thumbnail"/>-->

                        <!-- 없는 경우 플레이스홀더-->
<!--                        <img class="study-thumb"-->
<!--                             th:unless="${p.imagePath.length==0}"-->
<!--                             th:src="@{'/images/product-placeholder.jpg'}"-->
<!--                             alt="thumbnail"/>-->

<!--                        <img class="study-thumb"-->
<!--                           th:src="${p.imagePaths[0]}"/>-->


                        <!-- 리스트가 비었을 때: 플레이스홀더 -->
                        <img class="study-thumb"
                             th:if="${#lists.isEmpty(p.imagePaths)}"
                             th:src="@{/images/product-placeholder.jpg}"
                             alt="thumbnail"/>

                        <!-- 리스트가 있을 때: 첫 번째 이미지 -->
                        <img class="study-thumb"
                             th:if="${!#lists.isEmpty(p.imagePaths)}"
                             th:src="${p.imagePaths[0]}"
                             alt="thumbnail"/>

                        <div class="card-title">

                            <a class="study-link"
                               th:href="@{|/user/study/detail/${p.id}|}"
                               th:text="${p.title}"></a>
                            <a class="btn" th:href="@{|/user/study/detail/${p.id}|}">Show Case</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <!-- 페이징 처리 -->
        <div th:if="${!paging.empty}">
            <ul class="pagination justify-content-center">
                <!-- 이전 -->
                <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/product/list(page=${paging.number - 1}, size=${paging.size}, cat=${selectedCategoryId})}">
                        <span>이전</span>
                    </a>
                </li>

                <!-- 페이지 번호 -->
                <li class="page-item"
                    th:each="pg : ${#numbers.sequence(0, paging.totalPages - 1)}"
                    th:if="${pg >= paging.number - 5 and pg <= paging.number + 5}"
                    th:classappend="${pg == paging.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/user/product/list(page=${pg}, size=${paging.size}, cat=${selectedCategoryId})}"
                       th:text="${pg + 1}">
                    </a>
                </li>

                <!-- 다음 -->
                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/product/list(page=${paging.number + 1}, size=${paging.size}, cat=${selectedCategoryId})}">
                        <span>다음</span>
                    </a>
                </li>
            </ul>
        </div>

    </div>

</div>
</html>
