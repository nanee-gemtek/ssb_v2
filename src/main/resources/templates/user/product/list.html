<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <link rel="stylesheet" th:href="@{/css/user/product_list.css}">
<!--        <script defer th:src="@{/js/category_menu.js}"></script>-->
        <script defer th:src="@{/js/category_menu.js(v=${#dates.createNow().time})}"></script>
    </th:block>
</head>


<div layout:fragment="content" class="container product_list">
    <!--<div class="mb-4 text-center">
        <div class="btn-group" role="group">
            <a th:href="@{/user/product/list}"
               th:classappend="${selectedCategory == null} ? 'btn btn-primary' : 'btn btn-outline-primary'"
               class="btn">전체</a>
            <a th:each="cat : ${categories}"
               th:href="@{|/product/category/${cat.id}|}"
               th:text="${cat.name}"
               th:classappend="${selectedCategory != null and cat.id == selectedCategory.id} ? 'btn btn-primary' : 'btn btn-outline-primary'"
               class="btn"></a>
        </div>
    </div>-->

    <!-- 카테고리 메뉴 -->
    <aside class="categories-menu" data-one-open="true">
        <a th:href="@{/user/product/list}"
           class="cat-all"
           th:classappend="${selectedCategoryId} == null ? 'active'">
            All
        </a>

        <hr/>

        <!-- 루프: 루트별 섹션 -->
        <div class="cat-section"
             th:each="root : ${roots}"
             th:attr="data-open=${selectedCategoryId != null and (#lists.contains(childrenMap[root.id].![id], selectedCategoryId) or selectedCategoryId == root.id)}">

            <!-- 클릭해서 열고 닫기 (탭포커스/접근성을 위해 button 권장) -->
            <button type="button" class="cat-title" aria-expanded="false">
                <span th:text="${root.name}">Category</span>
                <span class="caret" aria-hidden="true">▾</span>
            </button>

            <ul class="cat-list">
                <li th:each="child : ${childrenMap[root.id]}">
                    <a th:href="@{/user/product/list(cat=${child.id})}"
                       th:text="${child.name}"
                       th:classappend="${selectedCategoryId} == ${child.id} ? 'active'">
                    </a>
                </li>
            </ul>
            <hr/>
        </div>
    </aside>

    <div class="wrap_list">
        <!-- 카드 그리드 -->
        <div class="card-grid">
            <!-- Page<Product>는 Iterable이지만, 명확히 content에 붙이는 걸 권장 -->
            <div class="card" th:each="p : ${paging.content}">
                <div class="card-body">

                    <!-- 생산자 배지 -->
                    <span class="badge"
                          th:if="${p.producer != null}"
                          th:text="${p.producer.name}">Producer</span>

                    <!-- 썸네일 + 제품명 -->
                    <div class="card-header">
                        <!-- 이미지 있는 경우 -->
                        <img class="product-thumb"
                             th:if="${p.images != null and !#lists.isEmpty(p.images)}"
                             th:src="${p.images[0].imagePath}"
                             alt="thumbnail"/>

                        <!-- 없는 경우 플레이스홀더 -->
                        <img class="product-thumb"
                             th:unless="${p.images != null and !#lists.isEmpty(p.images)}"
                             th:src="@{'/images/product-placeholder.jpg'}"
                             alt="thumbnail"/>

                        <div class="card-title">
                            <div class="category"
                                 th:text="${p.category != null ? p.category.name : 'Product'}">Product</div>

                            <a class="product-link"
                               th:href="@{|/user/product/detail/${p.id}|}"
                               th:text="${p.name}"></a>

                            <p class="desc" th:text="${p.subtitle}"></p>

                            <a class="btn" th:href="@{|/user/product/detail/${p.id}|}">Show Product</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <!-- 페이징 처리 -->
        <div th:if="${!paging.empty}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{|?page=${paging.number}&cat=${selectedCategoryId}|}">
                        <span>이전</span>
                    </a>
                </li>

                <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                    th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                    th:classappend="${page == paging.number} ? 'active'"
                    class="page-item">
                    <a class="page-link"
                       th:href="@{|?page=${page + 1}&cat=${selectedCategoryId}|}"
                       th:text="${page + 1}">
                    </a>
                </li>

                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{|?page=${paging.number + 2}&cat=${selectedCategoryId}|}">
                        <span>다음</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

</div>
</html>
