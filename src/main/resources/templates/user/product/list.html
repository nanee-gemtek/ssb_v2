<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <link rel="stylesheet" th:href="@{/css/product.css}">
    </th:block>
</head>


<div layout:fragment="content" class="container my-3">
    <div class="mb-4 text-center">
        <div class="btn-group" role="group">
            <a th:href="@{/user/product/list}"
               th:classappend="${selectedCategory == null} ? 'btn btn-primary' : 'btn btn-outline-primary'"
               class="btn">전체</a>
            <a th:each="cat : ${categories}"
               th:href="@{|/product/category/${cat.id}|}"
               th:text="${cat.name}"
               th:classappend="${selectedCategory != null and cat.id == selectedCategory.id} ? 'btn btn-primary' : 'btn btn-outline-primary'"
               class="btn"></a>
        </div>
    </div>

    <!-- 카드 그리드 -->
    <div class="card-grid">
        <div class="card" th:each="p : ${paging}">
            <div class="card-body">
                <!-- 상단 배지 (필요 시 표시) -->
                <span class="badge" th:text="${p.producerName}"></span>

                <!-- 썸네일 + 제품명 -->
                <div class="card-header">
                    <img class="product-thumb"
                         th:src="${#lists.isEmpty(p.imagePaths) ? '/images/product-placeholder.jpg' : p.imagePaths[0]}"
                         alt="thumbnail"/>
                    <div class="card-title">
                        <div class="category" th:text="${p.categoryName != null ? p.categoryName : 'Product'}">Product</div>
                        <a class="product-link"
                           th:href="@{|/user/product/detail/${p.id}|}"
                           th:text="${p.name}"></a>
                        <!-- 설명 -->
                        <p class="desc" th:text="${p.subtitle}"></p>
                        <a class="btn" th:href="@{|/user/product/detail/${p.id}|}">Show Product</a>
                    </div>
                </div>



                <!-- 핵심 스펙
                <ul class="spec-list">
                    <li>
                        <span>Measuring range - Distance</span>
                        <strong th:text="${p.title}"></strong>
                    </li>
                    <li>
                        <span>Process temperature</span>
                        <strong th:text="${p.subtitle}"></strong>
                    </li>
                </ul>
-->
                <!-- 하단 액션
                <div class="card-footer">
                    <a class="btn" th:href="@{|/user/product/detail/${p.id}|}">Show Product</a>
                </div>-->
            </div>
        </div>
    </div>


    <!-- 페이징 처리 -->
    <div th:if="${!paging.empty}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number}|}">
                    <span>이전</span>
                </a>
            </li>
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a class="page-link" th:href="@{|?page=${page + 1}|}" th:text="${page + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number + 2}|}">
                    <span>다음</span>
                </a>
            </li>
        </ul>
    </div>

</div>
</html>
