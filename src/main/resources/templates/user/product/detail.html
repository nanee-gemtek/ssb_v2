<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <!-- Flickity CSS -->
        <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
        <!-- JS (defer OK; flickity-sync는 flickity 이후에) -->
        <script defer src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
        <script defer src="https://unpkg.com/flickity-sync@2.0.0/flickity-sync.js"></script>
        <link rel="stylesheet" th:href="@{/css/user/product_detail.css}">
    </th:block>
</head>

<div layout:fragment="content" class="container">
    <p><strong>카테고리:</strong> <span th:text="${product.categoryName}">카테고리명</span></p>
    <div class="product_content">
        <div class="pc_left">
            <section>
                <div class="imgContainer">
                    <h1>Flickity Slider with Vertical Thumbnail</h1>

                    <div class="row" th:if="${product.imagePaths != null and !#lists.isEmpty(product.imagePaths)}">
                        <div class="left">
                            <!-- 썸네일 캐러셀: asNavFor 로 메인 연동 -->
                            <div class="carousel carousel-nav"
                                 data-flickity='{ "asNavFor": ".carousel-main", "contain": true, "pageDots": false, "setGallerySize": false ,"prevNextButtons":false}'>
                                <!-- ✅ 셀 반복 -->
                                <div class="carousel-cell" th:each="imgPath : ${product.imagePaths}">
                                    <img th:src="${imgPath}" class="img-fluid rounded shadow-sm" alt="제품 이미지 썸네일"/>
                                </div>
                            </div>
                        </div>

                        <div class="right">
                            <!-- 메인 캐러셀: sync 불필요 -->
                            <div class="carousel carousel-main"
                                 data-flickity='{ "prevNextButtons": false, "pageDots": false, "wrapAround": true }'>
                                <!-- ✅ 셀 반복 -->
                                <div class="carousel-cell" th:each="imgPath : ${product.imagePaths}">
                                    <img th:src="${imgPath}" class="img-fluid rounded shadow-sm" alt="제품 이미지"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="pc_right">
            <h2 class="" th:text="${product.name}">제품명</h2>
            <h5 class="" th:text="${product.title}">타이틀</h5>
            <p class="" th:text="${product.subtitle}">서브타이틀</p>
            <!-- 적용 분야 -->
            <h4 class="mt-4">적용 분야</h4>
            <div th:utext="${product.applicationArea}"></div>

            <!-- 장점 -->
            <h4 class="mt-4">장점</h4>
            <div th:utext="${product.advantages}"></div>
        </div>

        <div class="pc_btns"></div>
    </div>
    <div class="product-tables">
        <!-- 기술사양 -->
        <div th:if="${product.specifications != null and !#strings.isEmpty(product.specifications)}">
            <h4 class="mt-4">기술사양</h4>
            <div th:utext="${product.specifications}"></div>
        </div>

        <!-- 승인 -->
        <div th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
            <h4 class="mt-4">승인</h4>
            <div th:utext="${product.approval}"></div>
        </div>

        <!-- 디스플레이 및 조정 -->
        <div th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
            <h4 class="mt-4">디스플레이 및 조정</h4>
            <div th:utext="${product.displayControl}"></div>
        </div>
    </div>
    <div>
        <a href="/user/product/list" class="btn btn-secondary">목록으로</a>
    </div>
</div>
</html>
