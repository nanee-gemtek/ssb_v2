<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <!-- Flickity CSS -->
        <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
        <!-- JS (defer OK; flickity-sync는 flickity 이후에) -->
        <script defer src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
        <script defer src="https://unpkg.com/flickity-sync@2.0.0/flickity-sync.js"></script>
        <link rel="stylesheet" th:href="@{/css/user/sub.css}">
        <link rel="stylesheet" th:href="@{/css/user/product_detail.css}">
    </th:block>
</head>

<div layout:fragment="content" class="container container_sub">
    <p class="category_path">
        <a th:href="@{/user/product/list}">Products</a>&nbsp; >&nbsp;
        <a th:href="@{/user/product/list(cat=${product.categoryParentId})}" th:text="${product.categoryParentName}">부모 카테고리명</a>&nbsp; >&nbsp;
        <a th:href="@{/user/product/list(cat=${product.categoryId})}" th:text="${product.categoryName}">카테고리명</a>
    <div class="product_title">
        <h2 class="pc_name" th:text="${product.name}">제품명</h2>
        <h3 class="pc_title" th:text="${product.title}">타이틀</h3>
        <h4 class="pc_subtitle" th:text="${product.subtitle}">서브타이틀</h4>
    </div>
    <div class="product_content">
        <div class="pc_left">
            <section>
                <div class="pc_gallery" th:if="${product.imagePaths != null and !#lists.isEmpty(product.imagePaths)}">
                    <div class="left">
                        <!-- 썸네일 캐러셀: asNavFor 로 메인 연동 -->
                        <div class="carousel carousel-nav"
                             data-flickity='{ "asNavFor": ".carousel-main", "contain": true, "pageDots": false, "setGallerySize": false ,"prevNextButtons":false, "cellAlign":"right"}'>
                            <!-- ✅ 셀 반복 -->
                            <div class="carousel-cell" th:each="imgPath : ${product.imagePaths}">
                                <img th:src="${imgPath}" class="img-fluid rounded shadow-sm" alt="제품 이미지 썸네일"/>
                            </div>
                        </div>
                    </div>

                    <div class="right">
                        <!-- 메인 캐러셀: sync 불필요 -->
                        <div class="carousel carousel-main"
                             data-flickity='{ "prevNextButtons": false, "pageDots": false, "wrapAround": true }'>
                            <!-- ✅ 셀 반복 -->
                            <div class="carousel-cell" th:each="imgPath : ${product.imagePaths}">
                                <img th:src="${imgPath}" class="img-fluid rounded shadow-sm" alt="제품 이미지"/>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="pc_right">
            <div class="pc_description">
            <!-- 적용 분야 -->
                <h5>Application area</h5>
                <div th:utext="${product.applicationArea}"></div>

                <!-- 장점 -->
                <h5 class="mt-4">Your benefit</h5>
                <div th:utext="${product.advantages}"></div>
            </div>
        </div>
    </div>
    <div class="product_content2">
        <div class="doc-actions card">
            <h5>Specification sheet</h5>
            <!-- 사양서 -->
            <a th:if="${product.specDocPath != null and !#strings.isEmpty(product.specDocPath)}"
               th:href="@{${product.specDocPath}}"
               th:attr="download=${product.name + '-사양서.pdf'}"
               class="btn btn_download">
                Download
            </a>

            <h5>Operating instructions</h5>
            <!-- 사용설명서 -->
            <a th:if="${product.operatingDocPath != null and !#strings.isEmpty(product.operatingDocPath)}"
               th:href="@{${product.operatingDocPath}}"
               th:attr="download=${product.name + '-사용설명서.pdf'}"
               class="btn btn_download">
                Download
            </a>
        </div>
        <!-- 기술사양 -->
        <div class="spec_table" th:if="${product.specifications != null and !#strings.isEmpty(product.specifications)}">
            <div th:utext="${product.specifications}"></div>
        </div>

        <!-- 승인 -->
        <div class="spec_table" th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
            <div th:utext="${product.approval}"></div>
        </div>

        <!-- 디스플레이 및 조정 -->
        <div class="spec_table" th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
            <div th:utext="${product.displayControl}"></div>
        </div>

        <div class="btn_back">
            <!--/user/product/list?cat=2-->
            <a
                    class="back-link"
                    th:href="@{/user/product/list(cat=${product.categoryId})}"
                    aria-label="Back to ${product.categoryParentName} list"
            >
                <span class="back-link__icon" aria-hidden="true"><<</span>
                Back to <span class="back-link__name" th:utext="${product.categoryName}"></span>
            </a>
        </div>
    </div>

</div>
</html>
