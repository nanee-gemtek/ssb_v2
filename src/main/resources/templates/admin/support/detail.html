<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container my-4">
    <!-- 상단 정보 -->
    <div class="card mb-4">
        <div class="card-body d-flex flex-column flex-lg-row justify-content-between gap-3">
            <div>
                <ul class="list-unstyled d-flex flex-wrap gap-3 small text-body-secondary mb-0">
                    <li><span class="fw-semibold">회사명</span> <span th:text="${support.companyName}">companyName</span></li>
                    <li><span class="fw-semibold">작성자</span> <span th:text="${support.name}">name</span></li>
                    <li><span class="fw-semibold">작성일시</span> <span th:text="${#temporals.format(support.createDate, 'yyyy-MM-dd HH:mm')}">2025-09-30 10:00</span></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 문서 -->
    <div class="card mb-4">
        <div class="card-header bg-light fw-semibold">문서</div>
<!--        <div class="card-body d-flex flex-wrap gap-2">-->
<!--            <a th:if="${support.attachmentPath != null and !#strings.isEmpty(support.attachmentPath)}"-->
<!--               th:href="${support.attachmentPath}" target="_blank"-->
<!--               class="btn btn-sm btn-outline-secondary">-->
<!--                첨부파일-->
<!--            </a>-->

<!--            <span class="text-body-secondary small"-->
<!--                  th:if="${support.attachmentPath == null}">등록된 문서가 없습니다.</span>-->
<!--        </div>-->
        <div th:if="${support.attachmentPath != null and !#strings.isEmpty(support.attachmentPath)}" class="d-flex gap-2 align-items-center">
            <!-- 미리보기(새 탭) -->
            <a th:href="${support.attachmentPath}" target="_blank" class="btn btn-sm btn-outline-secondary">
                미리보기
            </a>
            <!-- 다운로드: 원본 파일명으로 저장 -->
            <a th:href="${support.attachmentPath}"
               th:attr="download=${support.attachmentOriginal}"
               th:text="${support.attachmentOriginal != null && !#strings.isEmpty(support.attachmentOriginal) ? support.attachmentOriginal : '다운로드'}"
               class="btn btn-sm btn-primary">
                다운로드
            </a>

            <!-- 파일 정보: (크기) -->
            <span class="text-muted"
                  th:with="
          size=${support.attachmentSize},
          kb=${size != null ? size / 1024.0 : 0},
          mb=${kb / 1024.0},
          pretty=${size == null ? '0 KB' : (size >= 1048576 ? #numbers.formatDecimal(mb,1,1) + ' MB' : #numbers.formatDecimal(kb,1,1) + ' KB')}
        "
                  th:text="${'(' + pretty + ')'}">
    (123.4 KB)
  </span>
        </div>
    </div>

    <!-- 본문 섹션들 -->
    <div class="card mb-4" th:if="${support.message != null and !#strings.isEmpty(support.message)}">
        <div class="card-header bg-light fw-semibold">문의내용</div>
        <div class="card-body" th:utext="${support.message}"></div>
    </div>


    <div class="mt-4">
        <a href="/admin/support/list" class="btn btn-secondary">목록으로</a>
    </div>

</div>
</html>
