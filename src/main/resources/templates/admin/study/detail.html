<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container my-4">
    <!-- 상단 정보 -->
    <div class="card mb-4">
        <div class="card-body d-flex flex-column flex-lg-row justify-content-between gap-3">
            <div>
                <h5 class="text-body-secondary mb-1" th:text="${study.title}">타이틀</h5>

                <ul class="list-unstyled d-flex flex-wrap gap-3 small text-body-secondary mb-0">
                    <li><span class="fw-semibold">작성자</span> <span th:text="${study.username}">admin</span></li>
                    <li><span class="fw-semibold">작성일시</span> <span th:text="${#temporals.format(study.createDate, 'yyyy-MM-dd HH:mm')}">2025-09-30 10:00</span></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 이미지 갤러리 -->
    <div class="card mb-4" th:if="${study.imagePaths != null and !#lists.isEmpty(study.imagePaths)}">
        <div class="card-header bg-light fw-semibold">이미지</div>
        <div class="card-body">
            <div class="image-grid">
                <div th:each="imgPath : ${study.imagePaths}" class="image-card">
                    <img th:src="@{${imgPath}}" alt="설치사례 이미지">
                    <div class="image-meta">
                <span class="image-name"
                      th:text="${#strings.substring(imgPath, imgPath.lastIndexOf('/')+1)}">image.jpg</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 본문 섹션들 -->
    <div class="card mb-4" th:if="${study.description != null and !#strings.isEmpty(study.description)}">
        <div class="card-header bg-light fw-semibold">본문/설명글</div>
        <div class="card-body" th:utext="${study.description}"></div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin/study/{id}/edit(id=${study.id})}"
           class="btn btn-outline-primary">
            수정하기
        </a>
        <a href="/admin/study/list" class="btn btn-secondary">목록으로</a>
    </div>

</div>
</html>
