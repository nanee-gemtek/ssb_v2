<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container my-4">

    <h2 class="mb-4" th:text="${product.name}">제품명</h2>
    <h5 class="text-muted" th:text="${product.title}">타이틀</h5>
    <p class="text-muted" th:text="${product.subtitle}">서브타이틀</p>
    <p><strong>작성자:</strong> <span th:text="${product.username}"></span></p>
    <p><strong>작성일시:</strong> <span th:text="${#temporals.format(product.createDate, 'yyyy-MM-dd HH:mm')}"></span></p>
    <p><strong>제품구성: 링크</strong> <span th:text="${product.configLink}"></span></p>
    <hr/>

    <!-- 이미지 미리보기 -->
    <div class="row my-4" th:if="${product.imagePaths != null}">
        <div class="col-md-3 mb-3" th:each="imgPath : ${product.imagePaths}">
            <img th:src="@{${imgPath}}" class="img-fluid rounded shadow-sm" alt="제품 이미지"/>
        </div>
    </div>

    <!-- 문서 -->
    <a th:if="${product.specDocPath}" th:href="${product.specDocPath}" class="btn btn-sm btn-outline-secondary" target="_blank">Specification</a>
    <a th:if="${product.operatingDocPath}" th:href="${product.operatingDocPath}" class="btn btn-sm btn-outline-secondary" target="_blank">Operating instruction</a>


    <p><strong>제조사:</strong> <span th:text="${product.producerName}">제조사명</span></p>
    <p><strong>카테고리:</strong> <span th:text="${product.categoryName}">카테고리명</span></p>


    <!-- 적용 분야 -->
    <h4 class="mt-4">적용 분야</h4>
    <div th:utext="${product.applicationArea}"></div>

    <!-- 장점 -->
    <h4 class="mt-4">장점</h4>
    <div th:utext="${product.advantages}"></div>

    <!-- 기술사양 -->
    <div th:if="${product.specifications != null and !#strings.isEmpty(product.specifications)}">
        <h4 class="mt-4">기술사양</h4>
        <div th:utext="${product.specifications}"></div>
    </div>

    <!-- 승인 -->
    <div th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
        <h4 class="mt-4">승인</h4>
        <div th:utext="${product.approval}"></div>
    </div>

    <!-- 디스플레이 및 조정 -->
    <div th:if="${product.displayControl != null and !#strings.isEmpty(product.displayControl)}">
        <h4 class="mt-4">디스플레이 및 조정</h4>
        <div th:utext="${product.displayControl}"></div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin/product/{id}/edit(id=${product.id})}"
           class="btn btn-outline-primary">
            수정하기
        </a>
        <a href="/admin/product/list" class="btn btn-secondary">목록으로</a>
    </div>

</div>
</html>
