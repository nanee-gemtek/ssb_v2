<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container my-4">
    <!-- 상단 정보 -->
    <div class="card mb-4">
        <div class="card-body d-flex flex-column flex-lg-row justify-content-between gap-3">
            <div>
                <h2 class="mb-1" th:text="${product.name}">제품명</h2>
                <div class="form-check mt-2">
                    <input
                            class="form-check-input"
                            type="checkbox"
                            id="featuredCheck"
                            disabled
                            th:checked="${product.featured != null and product.featured}">
                    <label class="form-check-label" for="featuredCheck">
                        메인 노출
                    </label>
                </div>
                <h5 class="text-body-secondary mb-1" th:text="${product.title}">타이틀</h5>
                <p class="text-body-secondary mb-2" th:text="${product.subtitle}">서브타이틀</p>

                <ul class="list-unstyled d-flex flex-wrap gap-3 small text-body-secondary mb-0">
                    <li><span class="fw-semibold">작성자</span> <span th:text="${product.username}">admin</span></li>
                    <li><span class="fw-semibold">작성일시</span> <span th:text="${#temporals.format(product.createDate, 'yyyy-MM-dd HH:mm')}">2025-09-30 10:00</span></li>
                    <li th:if="${product.producerName}">
                        <span class="fw-semibold">제조사</span> <span th:text="${product.producerName}">제조사명</span>
                    </li>
                    <li th:if="${product.categoryName}">
                        <span class="fw-semibold">카테고리</span> <span th:text="${product.categoryName}">카테고리명</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 이미지 갤러리 -->
    <div class="card mb-4" th:if="${product.imagePaths != null and !#lists.isEmpty(product.imagePaths)}">
        <div class="card-header bg-light fw-semibold">이미지</div>
        <div class="card-body">
            <div class="image-grid">
                <div th:each="imgPath : ${product.imagePaths}" class="image-card">
                    <img th:src="@{${imgPath}}" alt="제품 이미지">
                    <div class="image-meta">
                <span class="image-name"
                      th:text="${#strings.substring(imgPath, imgPath.lastIndexOf('/')+1)}">image.jpg</span>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- 카달로그 이미지 갤러리 -->
    <div class="card mb-4" th:if="${product.catalogImagePaths != null and !#lists.isEmpty(product.catalogImagePaths)}">
        <div class="card-header bg-light fw-semibold">이미지</div>
        <div class="card-body">
            <div class="image-grid">
                <div th:each="imgPath : ${product.catalogImagePaths}" class="image-card">
                    <img th:src="@{${imgPath}}" alt="카달로그 이미지">
                    <div class="image-meta">
                <span class="image-name"
                      th:text="${#strings.substring(imgPath, imgPath.lastIndexOf('/')+1)}">image.jpg</span>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- 문서 -->
    <div class="card mb-4">
        <div class="card-header bg-light fw-semibold">문서</div>
        <div class="card-body d-flex flex-wrap gap-2">
            <a th:if="${product.specDocPath != null and !#strings.isEmpty(product.specDocPath)}"
               th:href="${product.specDocPath}" target="_blank"
               class="btn btn-sm btn-outline-secondary">
                Specification
            </a>
            <a th:if="${product.operatingDocPath != null and !#strings.isEmpty(product.operatingDocPath)}"
               th:href="${product.operatingDocPath}" target="_blank"
               class="btn btn-sm btn-outline-secondary">
                Operating instruction
            </a>
            <span class="text-body-secondary small"
                  th:if="${(product.specDocPath == null or #strings.isEmpty(product.specDocPath))
               and (product.operatingDocPath == null or #strings.isEmpty(product.operatingDocPath))}">
      등록된 문서가 없습니다.
    </span>
        </div>
    </div>

    <!-- 본문 섹션들 -->
    <div class="card mb-4" th:if="${product.applicationArea != null and !#strings.isEmpty(product.applicationArea)}">
        <div class="card-header bg-light fw-semibold">적용 분야</div>
        <div class="card-body" th:utext="${product.applicationArea}"></div>
    </div>

    <div class="card mb-4" th:if="${product.advantages != null and !#strings.isEmpty(product.advantages)}">
        <div class="card-header bg-light fw-semibold">장점</div>
        <div class="card-body" th:utext="${product.advantages}"></div>
    </div>

    <!-- 기술사양 -->
    <div class="spec_table" th:if="${product.specifications != null and !#strings.isEmpty(product.specifications)}">
        <div th:utext="${product.specifications}"></div>
    </div>

    <!-- 승인 -->
    <div class="spec_table" th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
        <div th:utext="${product.approval}"></div>
    </div>

    <!-- 디스플레이 및 조정 -->
    <div class="spec_table" th:if="${product.approval != null and !#strings.isEmpty(product.approval)}">
        <div th:utext="${product.displayControl}"></div>
    </div>


    <div class="mt-4">
        <a th:href="@{/admin/product/{id}/edit(id=${product.id})}"
           class="btn btn-outline-primary">
            수정하기
        </a>
        <a href="/admin/product/list" class="btn btn-secondary">목록으로</a>
    </div>

</div>
</html>
