<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container my-3">
    <table class="table">
        <thead class="table-dark text-center">
        <tr>
            <th>번호</th>
            <th style="width:50%">제품명</th>
<!--            <th>카테고리 1</th>-->
<!--            <th>카테고리 2</th>-->
            <th>제조사</th>
            <th>작성자</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <tr class="text-center" th:each="product, loop : ${paging}">
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
            <td class="text-start">
                <a th:href="@{|/admin/product/detail/${product.id}|}">
                    [[${product.name}]]
                </a>
            </td>
            <td th:text="${product.producerName}"></td>
<!--            <td>vega</td>-->
            <td><span th:if="${product.username != null}" th:text="${product.username}"></span></td>
            <td th:text="${#temporals.format(product.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 처리 -->
    <div th:if="${!paging.empty}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number}|}">
                    <span>이전</span>
                </a>
            </li>
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a class="page-link" th:href="@{|?page=${page + 1}|}" th:text="${page + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number + 2}|}">
                    <span>다음</span>
                </a>
            </li>
        </ul>
    </div>

    <a th:href="@{create}" class="btn btn-primary">제품 등록하기</a>
</div>
</html>
