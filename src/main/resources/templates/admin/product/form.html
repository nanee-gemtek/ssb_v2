<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container py-4">

    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="my-0" th:text="${isEdit} ? '제품 수정' : '제품 등록'">제품 등록</h5>
    </div>

    <!-- 동적 action: 등록/수정 분기 -->
    <form id="productForm"
          th:action="${isEdit} ? @{/admin/product/update/{id}(id=${productDTO.id})}
                             : @{/admin/product/create}"
          th:object="${productDTO}"
          method="post" enctype="multipart/form-data">

        <!-- 수정 모드일 때 id 전달(안전) -->
        <input type="hidden" th:if="${isEdit}" th:field="*{id}"/>

        <!-- 기본 정보 -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <span class="form-section-title">기본 정보</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">제품명</label>
                        <input type="text" th:field="*{name}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">타이틀</label>
                        <input type="text" th:field="*{title}" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">서브타이틀</label>
                        <input type="text" th:field="*{subtitle}" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">제품구성 링크</label>
                        <input type="text" name="configLink" th:value="${productDTO.configLink}" class="form-control" placeholder="https://..." />
                    </div>
                    <div class="col-md-6">
                        <input class="form-check-input"
                               type="checkbox"
                               th:field="*{featured}">
                        <label class="form-check-label" for="featured">
                            메인 노출
                        </label>
                        <small class="text-muted ms-2">체크 시 메인 페이지에 노출</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- 분류/제조사 -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <span class="form-section-title">분류 및 제조사</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">제조사</label>
                        <select th:field="*{producerId}" class="form-select">
                            <option value="" disabled th:selected="${productDTO.producerId} == null">제조사를 선택하세요</option>
                            <option th:each="producer : ${producers}"
                                    th:value="${producer.id}"
                                    th:text="${producer.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">카테고리</label>
                        <select th:field="*{categoryId}" class="form-select">
                            <option value="" disabled th:selected="${productDTO.categoryId} == null">카테고리를 선택하세요</option>
                            <optgroup th:each="parent : ${topCategories}" th:label="${'▶ ' + parent.name}">
                                <option th:each="child : ${parent.children}"
                                        th:value="${child.id}"
                                        th:text="'   └ ' + ${child.name}">
                                </option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <!-- 제품 이미지 -->
        <div class="card mb-4">
            <div class="card-header bg-light d-flex align-items-center justify-content-between">
                <span class="form-section-title">이미지</span>
            </div>
            <div class="card-body">
                <div th:if="${isEdit and existingImages != null}" class="mb-3">
                    <label class="form-label d-block mb-2">기존 이미지</label>
                    <div class="image-grid">
                        <div th:each="img : ${existingImages}" class="image-card">
                            <img th:src="${img.imagePath}" alt="">
                            <div class="image-meta">
                                <span class="image-name" th:text="${#strings.substring(img.imagePath, img.imagePath.lastIndexOf('/')+1)}">image.jpg</span>
                                <label class="form-check-label d-inline-flex align-items-center gap-2 mb-0">
                                    <input class="form-check-input" type="checkbox" name="deleteImageIds" th:value="${img.id}">
                                    <span class="small">삭제</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">이미지 업로드</label>
                    <input type="file" name="images" id="imageUpload" multiple accept="image/*" class="form-control" />
                    <div id="imagePreview" class="image-grid mt-3"></div>
                    <div class="form-text">여러 장을 선택할 수 있습니다. (JPG/PNG 등)</div>
                </div>
            </div>
        </div>


        <!-- 카달로그 이미지 -->
        <div class="card mb-4">
            <div class="card-header bg-light align-items-center">
                <span class="form-section-title">카달로그 이미지</span>
                <span  style="font-size:11px; color:rgb(63, 142, 252);;margin:0;">하이퍼 제품 경우 상세정보를 카달로그 이미지로 대신한다.</span >
            </div>
            <div class="card-body">
                <!-- 기존: existingImages 를 참조하던 부분을 existingCatalogImages 로 분리 -->
                <div th:if="${isEdit and existingCatalogImages != null}" class="mb-3">
                    <label class="form-label d-block mb-2">기존 카달로그 이미지</label>
                    <div class="image-grid">
                        <div th:each="img : ${existingCatalogImages}" class="image-card">
                            <!-- 엔티티/DTO 속성이 catalogImagePath 라면 th:src 를 그에 맞게 변경 -->
                            <img th:src="${img.imagePath}" alt="">
                            <div class="image-meta">
            <span class="image-name"
                  th:text="${#strings.substring(img.imagePath, img.imagePath.lastIndexOf('/')+1)}">image.jpg</span>
                                <label class="form-check-label d-inline-flex align-items-center gap-2 mb-0">
                                    <!-- 체크박스 name 도 제품 이미지와 구분 -->
                                    <input class="form-check-input" type="checkbox" name="deleteCatalogImageIds" th:value="${img.id}">
                                    <span class="small">삭제</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">카달로그 이미지 업로드</label>
                    <input type="file" name="catalogImages" id="catalogImageUpload" multiple accept="image/*" class="form-control" />
                    <div id="catalogImagePreview" class="image-grid mt-3"></div>
                    <div class="form-text">여러 장을 선택할 수 있습니다. (JPG/PNG 등)</div>
                </div>
            </div>
        </div>


        <!-- 기존 문서 업로드 -->
        <div class="card mb-4">
            <div class="card-header bg-light d-flex align-items-center justify-content-between">
                <span class="form-section-title">문서</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Specification (PDF 등)</label><br/>
                        <div th:if="${isEdit}">
                            <div th:if="${productDTO.specDocPath}">
                                현재 사양서: <a th:href="${productDTO.specDocPath}" target="_blank">다운로드</a>
                                <label style="margin-left:8px;">
                                    <input type="checkbox" name="deleteSpecDoc"> 삭제
                                </label>
                            </div>
                            <br/>
                        </div>
                        <input type="file" name="specDoc" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                    </div>
                    <div class="col-md-6">
                        <label>Operating instruction (PDF 등)</label><br/>
                        <div th:if="${isEdit}">
                            <div th:if="${productDTO.operatingDocPath}" style="margin-top:6px;">
                                현재 사용설명서: <a th:href="${productDTO.operatingDocPath}" target="_blank">다운로드</a>
                                <label style="margin-left:8px;">
                                    <input type="checkbox" name="deleteOperatingDoc"> 삭제
                                </label>
                            </div>
                            <br/>
                        </div>
                        <input type="file" name="operatingDoc" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                    </div>
                </div>
            </div>
        </div>


        <!-- 내용 (CKEditor) -->
        <div class="card mb-4">
            <div class="card-header bg-light"><span class="form-section-title">내용</span></div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">적용 분야</label>
                    <textarea th:field="*{applicationArea}" id="applicationArea" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">장점</label>
                    <textarea th:field="*{advantages}" id="advantages" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">기술 사양</label>
                    <textarea th:field="*{specifications}" id="specifications" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">승인</label>
                    <textarea th:field="*{approval}" id="approval" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">디스플레이 및 조정</label>
                    <textarea th:field="*{displayControl}" id="displayControl" class="form-control"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"
                    th:text="${isEdit} ? '글 전체 수정' : '글 전체 등록'">글 전체 등록</button>
            <a class="btn btn-outline-secondary" th:href="@{|/admin/product/detail/${productDTO.id}|}">취소</a>
        </div>
    </form>

    <!-- CKEditor + 이미지 누적 프리뷰 스크립트 (그대로 사용 가능) -->
    <script>
        // ===== CKEditor 초기화 =====
        ['applicationArea','advantages','specifications','approval','displayControl'].forEach(id=>{
          ClassicEditor.create(document.querySelector('#'+id),{
            toolbar:['heading','|','bold','italic','link','bulletedList','numberedList','insertTable','|','undo','redo'],
            table:{contentToolbar:['tableColumn','tableRow','mergeTableCells']}
          }).catch(console.error);
        });

        // ===== 공통: 파일 미리보기(누적/삭제 지원) 유틸 =====
        /**
         * 여러 input에 대해 동일한 누적 미리보기 동작을 적용
         * @param {string} inputId - <input type="file" id="...">
         * @param {string} previewId - 미리보기 컨테이너 id
         */
        function setupFilePreview(inputId, previewId) {
          const inputEl = document.getElementById(inputId);
          const previewEl = document.getElementById(previewId);

          if (!inputEl || !previewEl) return;

          /** @type {File[]} */
          let store = [];

          function syncInputFromStore(){
            const dt = new DataTransfer();
            store.forEach(f => dt.items.add(f));
            inputEl.files = dt.files;
          }

          function renderPreview(){
            previewEl.innerHTML = '';
            store.forEach((file, idx) => {
              if (!file.type?.startsWith('image/')) return;

              const card = document.createElement('div');
              card.style.display = 'inline-flex';
              card.style.flexDirection = 'column';
              card.style.alignItems = 'center';
              card.style.gap = '6px';
              card.style.marginRight = '8px';
              card.style.marginBottom = '8px';

              const img = document.createElement('img');
              img.style.width = '180px';
              img.style.height = '120px';
              img.style.objectFit = 'cover';
              img.style.border = '1px solid #ccc';
              img.style.padding = '4px';
              img.style.background = '#f8f8f8';
              img.alt = file.name;

              const name = document.createElement('div');
              name.style.fontSize = '12px';
              name.style.maxWidth = '180px';
              name.style.whiteSpace = 'nowrap';
              name.style.overflow = 'hidden';
              name.style.textOverflow = 'ellipsis';
              name.title = file.name;
              name.textContent = file.name;

              const del = document.createElement('button');
              del.type = 'button';
              del.textContent = '삭제';
              del.className = 'btn btn-sm btn-outline-danger';
              del.onclick = () => {
                store.splice(idx, 1);
                syncInputFromStore();
                renderPreview();
              };

              const reader = new FileReader();
              reader.onload = e => img.src = e.target.result;
              reader.readAsDataURL(file);

              card.appendChild(img);
              card.appendChild(name);
              card.appendChild(del);
              previewEl.appendChild(card);
            });
          }

          // 기존 파일 + 새로 선택한 파일을 "중복 없이" 누적
          inputEl.addEventListener('change', () => {
            const newly = Array.from(inputEl.files);
            newly.forEach(f => {
              const exists = store.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified);
              if (!exists) store.push(f);
            });
            syncInputFromStore();
            renderPreview();
          });

          // 외부에서 필요하다면 스토어 제어용 핸들러를 반환할 수도 있음
          return {
            getFiles: () => store.slice(),
            clear: () => { store = []; syncInputFromStore(); renderPreview(); }
          };
        }

        // ====== 적용: 일반 이미지 & 카달로그 이미지 ======
        // 일반 이미지(이미 사용 중이던 프리뷰를 공통 유틸로 교체)
        setupFilePreview('imageUpload', 'imagePreview');

        // 카달로그 이미지(새로 연결)
        setupFilePreview('catalogImageUpload', 'catalogImagePreview');
    </script>


</div>
</html>
