<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container py-4">

    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="my-0" th:text="${isEdit} ? '제품 수정' : '제품 등록'">제품 등록</h5>
    </div>

    <!-- 동적 action: 등록/수정 분기 -->
    <form id="productForm"
          th:action="${isEdit} ? @{/admin/product/update/{id}(id=${productDTO.id})}
                             : @{/admin/product/create}"
          th:object="${productDTO}"
          method="post" enctype="multipart/form-data">

        <!-- 수정 모드일 때 id 전달(안전) -->
        <input type="hidden" th:if="${isEdit}" th:field="*{id}"/>

        <!-- 기본 정보 -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <span class="form-section-title">기본 정보</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">제품명</label>
                        <input type="text" th:field="*{name}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">타이틀</label>
                        <input type="text" th:field="*{title}" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">서브타이틀</label>
                        <input type="text" th:field="*{subtitle}" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">제품구성 링크</label>
                        <input type="text" name="configLink" th:value="${productDTO.configLink}" class="form-control" placeholder="https://..." />
                    </div>
                </div>
            </div>
        </div>

        <!-- 분류/제조사 -->
        <div class="card mb-4">
            <div class="card-header bg-light">
                <span class="form-section-title">분류 및 제조사</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">제조사</label>
                        <select th:field="*{producerId}" class="form-select">
                            <option value="" disabled th:selected="${productDTO.producerId} == null">제조사를 선택하세요</option>
                            <option th:each="producer : ${producers}"
                                    th:value="${producer.id}"
                                    th:text="${producer.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">카테고리</label>
                        <select th:field="*{categoryId}" class="form-select">
                            <option value="" disabled th:selected="${productDTO.categoryId} == null">카테고리를 선택하세요</option>
                            <optgroup th:each="parent : ${topCategories}" th:label="${'▶ ' + parent.name}">
                                <option th:each="child : ${parent.children}"
                                        th:value="${child.id}"
                                        th:text="'   └ ' + ${child.name}">
                                </option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <!-- 이미지 -->
        <div class="card mb-4">
            <div class="card-header bg-light d-flex align-items-center justify-content-between">
                <span class="form-section-title">이미지</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="alert('이미지 미리보기 완료!')">
                    이미지 미리보기 완료
                </button>
            </div>
            <div class="card-body">
                <div th:if="${isEdit and existingImages != null}" class="mb-3">
                    <label class="form-label d-block mb-2">기존 이미지</label>
                    <div class="image-grid">
                        <div th:each="img : ${existingImages}" class="image-card">
                            <img th:src="${img.imagePath}" alt="">
                            <div class="image-meta">
                                <span class="image-name" th:text="${#strings.substring(img.imagePath, img.imagePath.lastIndexOf('/')+1)}">image.jpg</span>
                                <label class="form-check-label d-inline-flex align-items-center gap-2 mb-0">
                                    <input class="form-check-input" type="checkbox" name="deleteImageIds" th:value="${img.id}">
                                    <span class="small">삭제</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">이미지 업로드</label>
                    <input type="file" name="images" id="imageUpload" multiple accept="image/*" class="form-control" />
                    <div id="imagePreview" class="image-grid mt-3"></div>
                    <div class="form-text">여러 장을 선택할 수 있습니다. (JPG/PNG 등)</div>
                </div>
            </div>
        </div>

        <!-- 기존 문서 업로드 -->
        <div class="card mb-4">
            <div class="card-header bg-light d-flex align-items-center justify-content-between">
                <span class="form-section-title">문서</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Specification (PDF 등)</label><br/>
                        <div th:if="${isEdit}">
                            <div th:if="${productDTO.specDocPath}">
                                현재 사양서: <a th:href="${productDTO.specDocPath}" target="_blank">다운로드</a>
                                <label style="margin-left:8px;">
                                    <input type="checkbox" name="deleteSpecDoc"> 삭제
                                </label>
                            </div>
                            <br/>
                        </div>
                        <input type="file" name="specDoc" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                    </div>
                    <div class="col-md-6">
                        <label>Operating instruction (PDF 등)</label><br/>
                        <div th:if="${isEdit}">
                            <div th:if="${productDTO.operatingDocPath}" style="margin-top:6px;">
                                현재 사용설명서: <a th:href="${productDTO.operatingDocPath}" target="_blank">다운로드</a>
                                <label style="margin-left:8px;">
                                    <input type="checkbox" name="deleteOperatingDoc"> 삭제
                                </label>
                            </div>
                            <br/>
                        </div>
                        <input type="file" name="operatingDoc" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                    </div>
                </div>
            </div>
        </div>



        <!-- 수정 모드일 때 기존 문서 표시 + 삭제 체크
        <div th:if="${isEdit}">
            <div th:if="${productDTO.specDocPath}">
                현재 사양서: <a th:href="${productDTO.specDocPath}" target="_blank">다운로드</a>
                <label style="margin-left:8px;">
                    <input type="checkbox" name="deleteSpecDoc"> 삭제
                </label>
            </div>
            <div th:if="${productDTO.operatingDocPath}" style="margin-top:6px;">
                현재 사용설명서: <a th:href="${productDTO.operatingDocPath}" target="_blank">다운로드</a>
                <label style="margin-left:8px;">
                    <input type="checkbox" name="deleteOperatingDoc"> 삭제
                </label>
            </div>
            <br/>
        </div>
        -->



        <!-- 내용 (CKEditor) -->
        <div class="card mb-4">
            <div class="card-header bg-light"><span class="form-section-title">내용</span></div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">적용 분야</label>
                    <textarea th:field="*{applicationArea}" id="applicationArea" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">장점</label>
                    <textarea th:field="*{advantages}" id="advantages" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">기술 사양</label>
                    <textarea th:field="*{specifications}" id="specifications" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">승인</label>
                    <textarea th:field="*{approval}" id="approval" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">디스플레이 및 조정</label>
                    <textarea th:field="*{displayControl}" id="displayControl" class="form-control"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"
                    th:text="${isEdit} ? '글 전체 수정' : '글 전체 등록'">글 전체 등록</button>
            <a href="#" class="btn btn-outline-secondary">취소</a>
        </div>
    </form>

    <!-- CKEditor + 이미지 누적 프리뷰 스크립트 (그대로 사용 가능) -->
    <script>
        ['applicationArea','advantages','specifications','approval','displayControl'].forEach(id=>{
          ClassicEditor.create(document.querySelector('#'+id),{
            toolbar:['heading','|','bold','italic','link','bulletedList','numberedList','insertTable','|','undo','redo'],
            table:{contentToolbar:['tableColumn','tableRow','mergeTableCells']}
          }).catch(console.error);
        });

        const imageInput = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        let fileStore = [];

        function syncInputFromStore(){
          const dt = new DataTransfer();
          fileStore.forEach(f=>dt.items.add(f));
          imageInput.files = dt.files;
        }
        function renderPreview(){
          imagePreview.innerHTML='';
          fileStore.forEach((file,idx)=>{
            if(!file.type?.startsWith('image/')) return;
            const wrap=document.createElement('div');
            wrap.style.display='inline-flex';
            wrap.style.flexDirection='column';
            wrap.style.alignItems='center';
            wrap.style.gap='6px';

            const img=document.createElement('img');
            img.style.width='180px'; img.style.height='120px'; img.style.objectFit='cover';
            img.style.border='1px solid #ccc'; img.style.padding='4px'; img.style.background='#f8f8f8';

            const name=document.createElement('div');
            name.style.fontSize='12px'; name.style.maxWidth='180px';
            name.style.whiteSpace='nowrap'; name.style.overflow='hidden'; name.style.textOverflow='ellipsis';
            name.title=file.name; name.textContent=file.name;

            const del=document.createElement('button');
            del.type='button'; del.textContent='삭제'; del.className='btn btn-sm btn-outline-danger';
            del.onclick=()=>{ fileStore.splice(idx,1); syncInputFromStore(); renderPreview(); };

            const reader=new FileReader();
            reader.onload=e=>img.src=e.target.result;
            reader.readAsDataURL(file);

            wrap.appendChild(img); wrap.appendChild(name); wrap.appendChild(del);
            imagePreview.appendChild(wrap);
          });
        }
        imageInput?.addEventListener('change', ()=>{
          const newly=Array.from(imageInput.files);
          newly.forEach(f=>{
            const exists=fileStore.some(x=>x.name===f.name && x.size===f.size && x.lastModified===f.lastModified);
            if(!exists) fileStore.push(f);
          });
          syncInputFromStore(); renderPreview();
        });
    </script>

</div>
</html>
