<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}">
<div layout:fragment="content" class="container">

    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>/* 기존 스타일 그대로 */</style>

    <h5 class="my-3 border-bottom pb-2" th:text="${isEdit} ? '제품 수정' : '제품 등록'">제품 등록</h5>

    <!-- 동적 action: 등록/수정 분기 -->
    <form id="productForm"
          th:action="${isEdit} ? @{/admin/product/update/{id}(id=${productDTO.id})}
                             : @{/admin/product/create}"
          th:object="${productDTO}"
          method="post" enctype="multipart/form-data">

        <!-- 수정 모드일 때 id 전달(안전) -->
        <input type="hidden" th:if="${isEdit}" th:field="*{id}"/>

        <label>제품명</label><br/>
        <input type="text" th:field="*{name}" /><br/><br/>

        <label>타이틀</label><br/>
        <input type="text" th:field="*{title}" /><br/><br/>

        <label>서브타이틀</label><br/>
        <input type="text" th:field="*{subtitle}" /><br/><br/>

        <label>제조사</label><br/>
        <select th:field="*{producerId}">
            <option value="" disabled th:selected="${productDTO.producerId} == null">제조사를 선택하세요</option>
            <option th:each="producer : ${producers}"
                    th:value="${producer.id}"
                    th:text="${producer.name}">
            </option>
        </select><br/><br/>

        <label>카테고리</label><br/>
        <select th:field="*{categoryId}">
            <!-- (선택) 플레이스홀더 -->
            <option value="" disabled
                    th:selected="${productDTO.categoryId} == null">카테고리를 선택하세요</option>

            <optgroup th:each="parent : ${topCategories}"
                      th:label="${'▶ ' + parent.name}">
                <option th:each="child : ${parent.children}"
                        th:value="${child.id}"
                        th:text="'   └ ' + ${child.name}">
                </option>
            </optgroup>
        </select>

        <!-- (수정 모드) 기존 이미지 보여주고 삭제 체크 -->
        <div th:if="${isEdit and existingImages != null}">
            <label>기존 이미지</label>
            <div class="image-preview">
                <div th:each="img : ${existingImages}" style="display:inline-flex;flex-direction:column;gap:6px;align-items:center;">
                    <img th:src="${img.imagePath}" alt="" style="width:180px;height:120px;object-fit:cover;border:1px solid #ccc;padding:4px;background:#f8f8f8;"/>
                    <label style="font-size:12px">
                        <input type="checkbox" name="deleteImageIds" th:value="${img.id}"> 삭제
                    </label>
                </div>
            </div>
            <br/>
        </div>

        <label>이미지 업로드</label><br/>
        <input type="file" name="images" id="imageUpload" multiple accept="image/*" /><br/>
        <div id="imagePreview" class="image-preview"></div>
        <br/>

        <!-- 문서 업로드 -->
        <label>Specification (PDF 등)</label><br/>
        <input type="file" name="specDoc" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><br/><br/>

        <label>Operating instruction (PDF 등)</label><br/>
        <input type="file" name="operatingDoc" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><br/><br/>

        <!-- 수정 모드일 때 기존 문서 표시 + 삭제 체크 -->
        <div th:if="${isEdit}">
            <div th:if="${productDTO.specDocPath}">
                현재 사양서: <a th:href="${productDTO.specDocPath}" target="_blank">다운로드</a>
                <label style="margin-left:8px;">
                    <input type="checkbox" name="deleteSpecDoc"> 삭제
                </label>
            </div>
            <div th:if="${productDTO.operatingDocPath}" style="margin-top:6px;">
                현재 사용설명서: <a th:href="${productDTO.operatingDocPath}" target="_blank">다운로드</a>
                <label style="margin-left:8px;">
                    <input type="checkbox" name="deleteOperatingDoc"> 삭제
                </label>
            </div>
            <br/>
        </div>



        <button type="button" class="btn btn-secondary" onclick="alert('이미지 미리보기 완료!')">이미지 미리보기 완료</button>
        <br/><br/>

        <label>적용 분야</label><br/>
        <textarea th:field="*{applicationArea}" id="applicationArea"></textarea><br/><br/>

        <label>장점</label><br/>
        <textarea th:field="*{advantages}" id="advantages"></textarea><br/><br/>

        <label>기술사양</label><br/>
        <textarea th:field="*{specifications}" id="specifications"></textarea><br/><br/>

        <label>승인</label><br/>
        <textarea th:field="*{certification}" id="certification"></textarea><br/><br/>

        <label>디스플레이 및 조정</label><br/>
        <textarea th:field="*{displayControl}" id="displayControl"></textarea><br/><br/>

        <button type="submit" class="btn btn-primary"
                th:text="${isEdit} ? '글 전체 수정' : '글 전체 등록'">글 전체 등록</button>
    </form>

    <!-- CKEditor + 이미지 누적 프리뷰 스크립트 (그대로 사용 가능) -->
    <script>
        ['applicationArea','advantages','specifications','certification','displayControl'].forEach(id=>{
          ClassicEditor.create(document.querySelector('#'+id),{
            toolbar:['heading','|','bold','italic','link','bulletedList','numberedList','insertTable','|','undo','redo'],
            table:{contentToolbar:['tableColumn','tableRow','mergeTableCells']}
          }).catch(console.error);
        });

        const imageInput = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        let fileStore = [];

        function syncInputFromStore(){
          const dt = new DataTransfer();
          fileStore.forEach(f=>dt.items.add(f));
          imageInput.files = dt.files;
        }
        function renderPreview(){
          imagePreview.innerHTML='';
          fileStore.forEach((file,idx)=>{
            if(!file.type?.startsWith('image/')) return;
            const wrap=document.createElement('div');
            wrap.style.display='inline-flex';
            wrap.style.flexDirection='column';
            wrap.style.alignItems='center';
            wrap.style.gap='6px';

            const img=document.createElement('img');
            img.style.width='180px'; img.style.height='120px'; img.style.objectFit='cover';
            img.style.border='1px solid #ccc'; img.style.padding='4px'; img.style.background='#f8f8f8';

            const name=document.createElement('div');
            name.style.fontSize='12px'; name.style.maxWidth='180px';
            name.style.whiteSpace='nowrap'; name.style.overflow='hidden'; name.style.textOverflow='ellipsis';
            name.title=file.name; name.textContent=file.name;

            const del=document.createElement('button');
            del.type='button'; del.textContent='삭제'; del.className='btn btn-sm btn-outline-danger';
            del.onclick=()=>{ fileStore.splice(idx,1); syncInputFromStore(); renderPreview(); };

            const reader=new FileReader();
            reader.onload=e=>img.src=e.target.result;
            reader.readAsDataURL(file);

            wrap.appendChild(img); wrap.appendChild(name); wrap.appendChild(del);
            imagePreview.appendChild(wrap);
          });
        }
        imageInput?.addEventListener('change', ()=>{
          const newly=Array.from(imageInput.files);
          newly.forEach(f=>{
            const exists=fileStore.some(x=>x.name===f.name && x.size===f.size && x.lastModified===f.lastModified);
            if(!exists) fileStore.push(f);
          });
          syncInputFromStore(); renderPreview();
        });
    </script>

</div>
</html>
